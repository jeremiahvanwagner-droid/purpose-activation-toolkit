name: Live book catalog links

# Nightly read-only checks of the published Vercel print shelf.
# Product purchases happen on Lulu; this workflow checks only links.
on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/check-meta-book-links.mjs"
      - "lib/store/lulu-books.data.json"
      - "middleware.ts"
      - ".github/workflows/book-links.yml"

permissions:
  contents: read

concurrency:
  group: book-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-public-book-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify live book pages, Lulu checkout URLs, and old Meta tags
        run: node scripts/check-meta-book-links.mjs
