<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Truth J Blue — feed plate</title>
<!--
  A 1200×1200 rendering of the storefront's typographic product plate, for the
  Meta product feed (app/api/meta-feed). Every value here is the store's own
  .st-plate rule from app/store/store.css scaled ×3 from its ~400px card, with
  the same brand tokens from app/globals.css, so an ad and the product page it
  lands on carry the same artwork. Open with ?slug=<store slug>; render.sh does
  this for every plate item with headless Chrome.
-->
<style>
  :root {
    --navy: #101B40; --navy-deep: #0A1230; --gold-bright: #E7C97F;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  html, body { margin: 0; width: 1200px; height: 1200px; overflow: hidden; background: var(--navy); font-family: var(--sans); }
  .st-plate {
    position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between;
    padding: 90px; color: #F1EAD7; overflow: hidden;
    background:
      radial-gradient(2100px 1200px at 82% 8%, rgba(231, 201, 127, 0.22), transparent 60%),
      radial-gradient(1500px 1200px at 0% 100%, rgba(231, 201, 127, 0.10), transparent 60%),
      linear-gradient(160deg, var(--navy), var(--navy-deep));
  }
  .st-plate-v2 {
    background:
      radial-gradient(2100px 1200px at 12% 10%, rgba(231, 201, 127, 0.20), transparent 60%),
      radial-gradient(1500px 1200px at 100% 100%, rgba(231, 201, 127, 0.12), transparent 60%),
      linear-gradient(200deg, var(--navy), var(--navy-deep));
  }
  .st-plate-v3 {
    background:
      radial-gradient(1800px 1200px at 50% -10%, rgba(231, 201, 127, 0.18), transparent 60%),
      radial-gradient(1800px 900px at 50% 110%, rgba(231, 201, 127, 0.12), transparent 60%),
      linear-gradient(180deg, #14204B, var(--navy-deep));
  }
  .st-plate::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0.6;
    background-image:
      radial-gradient(4.2px 4.2px at 14% 18%, rgba(255, 255, 255, 0.7), transparent),
      radial-gradient(3.3px 3.3px at 78% 26%, rgba(255, 255, 255, 0.5), transparent),
      radial-gradient(3.6px 3.6px at 40% 62%, rgba(231, 201, 127, 0.6), transparent),
      radial-gradient(3px 3px at 88% 70%, rgba(255, 255, 255, 0.45), transparent),
      radial-gradient(3.9px 3.9px at 24% 86%, rgba(231, 201, 127, 0.55), transparent),
      radial-gradient(3px 3px at 60% 90%, rgba(255, 255, 255, 0.5), transparent);
  }
  .st-plate-v2::before { transform: scaleX(-1); }
  .st-plate-v3::before { transform: scaleY(-1); }
  .st-plate::after { content: ""; position: absolute; inset: 36px; border: 3px solid rgba(231, 201, 127, 0.3); border-radius: 30px; pointer-events: none; }
  .st-plate-kicker { position: relative; font-size: 27px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold-bright); }
  .st-plate-title {
    position: relative; font-family: var(--serif); font-weight: 500;
    font-size: 112px; line-height: 1.06; letter-spacing: -0.01em; text-wrap: balance; max-width: 12ch;
  }
  .st-plate-title em { color: var(--gold-bright); font-style: italic; font-weight: 400; }
  .st-plate-foot { position: relative; display: flex; align-items: center; gap: 24px; font-size: 27px; letter-spacing: 0.26em; text-transform: uppercase; color: rgba(241, 234, 215, 0.7); }
  .st-plate-foot svg { width: 54px; height: 54px; color: var(--gold-bright); }
</style>
</head>
<body>
<div id="plate" class="st-plate">
  <div class="st-plate-kicker" id="kicker"></div>
  <div class="st-plate-title" id="title"></div>
  <div class="st-plate-foot">
    <!-- The constellation mark, same paths as components/store/Glyph.tsx -->
    <svg viewBox="0 0 40 40" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="1.3"><path d="M8 26 L18 9 L26 22 L33 13" stroke-opacity="0.55" /></g>
      <g fill="currentColor"><circle cx="8" cy="26" r="2.1" /><circle cx="18" cy="9" r="2.6" /><circle cx="26" cy="22" r="2.1" /><circle cx="33" cy="13" r="1.8" /></g>
      <circle cx="18" cy="9" r="5.5" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1" />
    </svg>
    <span>Truth J Blue</span>
  </div>
</div>
<script>
  // kicker (collection short name), title, accent, variant — from lib/store/overlay.ts
  var PLATES = {
    "inner-alignment-audit":            ["Start Here",         "Inner Alignment",    "Audit",              1],
    "purpose-activation-toolkit":       ["Start Here",         "Purpose Activation", "Toolkit",            2],
    "inner-work-integration-course-47": ["Courses",            "Inner-Work",         "Integration Course", 3],
    "divine-alignment-blueprint":       ["Courses",            "Divine Alignment",   "Blueprint",          1],
    "first-step-through-the-veil":      ["Courses",            "First Step",         "Through the Veil",   2],
    "deep-dive-call":                   ["Work With Jeremiah", "Deep Dive",          "with Jeremiah",      3]
  };
  var slug = new URLSearchParams(location.search).get("slug");
  var p = PLATES[slug] || ["Truth J Blue", slug || "", "", 1];
  document.getElementById("plate").classList.add("st-plate-v" + p[3]);
  document.getElementById("kicker").textContent = p[0];
  var t = document.getElementById("title");
  t.textContent = p[1] + " ";
  var em = document.createElement("em"); em.textContent = p[2]; t.appendChild(em);
</script>
</body>
</html>
